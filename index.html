<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b11"><title>LAST SEEN</title>
<style>
:root{color-scheme:dark;--bg:#080b11;--panel:#111a27;--line:#263448;--muted:#8d9bb0;--blue:#4b94ff;--text:#f3f6fb}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#05070b;color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:flex;justify-content:center}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}#phone{width:min(100%,430px);height:100dvh;min-height:600px;background:radial-gradient(ellipse at 50% -8%,#26364c 0,#111b29 34%,#090e17 75%);position:relative;overflow:hidden;isolation:isolate}.status{height:48px;padding:13px 25px 0;display:flex;align-items:flex-start;justify-content:space-between;font-size:12px;font-weight:700;letter-spacing:.2px;color:#f4f7fc}.status-right{display:flex;align-items:center;gap:6px}.status svg{width:16px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#home{padding:30px 24px 120px;height:calc(100% - 48px);overflow:auto}.date{color:#9eacc0;font-size:11px;font-weight:650;letter-spacing:1.5px;margin:8px 0 3px}.clock{font-size:70px;font-weight:230;letter-spacing:-4px;line-height:1.08;margin-bottom:48px;color:#f7f9fd}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:30px 10px}.app{border:0;background:none;color:#dce5f1;display:flex;flex-direction:column;align-items:center;gap:9px;font-size:10px;font-weight:550;padding:0;min-width:0}.icon{width:58px;height:58px;border-radius:19px;display:grid;place-items:center;background:linear-gradient(145deg,#34465e,#182334);box-shadow:0 9px 22px #0007,inset 0 1px #ffffff2a;border:1px solid #ffffff20}.icon svg{width:27px;height:27px;stroke:white;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.messages{background:linear-gradient(145deg,#48d98b,#147849)}.photos{background:linear-gradient(145deg,#f2c86c,#bb674f)}.phoneapp{background:linear-gradient(145deg,#4bd49a,#147b5b)}.browser{background:linear-gradient(145deg,#70bdff,#315eb5)}.notes{background:linear-gradient(145deg,#f3d47b,#bd8e29)}.notes svg{stroke:#3b3217}.settings{background:linear-gradient(145deg,#aeb9c9,#59677a)}
.dock{position:absolute;z-index:2;bottom:max(13px,env(safe-area-inset-bottom));left:18px;right:18px;height:76px;border-radius:25px;background:#c5d4e51b;border:1px solid #ffffff20;backdrop-filter:blur(28px);display:flex;justify-content:space-evenly;align-items:center;box-shadow:0 12px 30px #0004}.dock button{width:50px;height:50px;border:0;border-radius:16px;background:#ffffff0d;color:white;display:grid;place-items:center}.dock svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#appview{position:absolute;inset:48px 0 0;background:linear-gradient(180deg,#0e1622,#090e16);display:none;flex-direction:column}.top{height:62px;flex:none;display:grid;grid-template-columns:76px 1fr 76px;align-items:center;padding:0 17px;border-bottom:1px solid #ffffff0d;background:#101925eF;backdrop-filter:blur(18px)}.back{border:0;background:none;color:#83b6ff;font-size:14px;padding:10px 0;text-align:left}.back:active{opacity:.65}.apptitle{font-weight:700;font-size:15px;text-align:center;letter-spacing:.2px}.content{padding:19px 16px 30px;overflow:auto;flex:1;overscroll-behavior:contain}.section-label{font-size:10px;color:#7f91a9;letter-spacing:1.45px;font-weight:700;margin:2px 3px 14px}.card{background:linear-gradient(145deg,#182536,#111a27);border:1px solid #ffffff0e;border-radius:18px;padding:15px;margin-bottom:11px;box-shadow:0 8px 22px #0002}.muted{color:var(--muted);font-size:12px}.row{display:flex;align-items:center;gap:12px}.avatar{width:46px;height:46px;flex:none;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,#405875,#1b2b40);font-weight:700;font-size:16px;border:1px solid #ffffff1b;color:#edf4ff}.choice{width:100%;text-align:left;padding:15px 16px;border-radius:15px;background:linear-gradient(145deg,#1c2c41,#141f2d);color:#eaf1ff;border:1px solid #ffffff16;margin:7px 0;font-size:14px;line-height:1.4;transition:transform .15s,border-color .15s}.choice:active{transform:scale(.985);border-color:#5597ef}.bubble{max-width:88%;padding:12px 15px;border-radius:18px;margin:9px 0;background:#202c3b;line-height:1.48;white-space:pre-wrap;border:1px solid #ffffff09;color:#edf2f9}.mine{margin-left:auto;background:linear-gradient(145deg,#2878d7,#1759a9);border-color:#ffffff16}.timestamp{text-align:center;color:#788aa2;font-size:10px;letter-spacing:1px;text-transform:uppercase;margin:19px 0 13px}.notice{color:#8294aa;font-size:11px;margin:15px 3px}.chat-preview{font-size:12px;color:#a2b0c3;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-name{font-size:14px;font-weight:650;color:#f2f5fa}.card.row{padding:13px 14px;cursor:pointer;transition:transform .15s,border-color .15s}.card.row:active{transform:scale(.99);border-color:#ffffff25}.chat-meta{font-size:10px;color:#73849a;margin-left:auto;align-self:flex-start;padding-top:3px;white-space:nowrap}textarea{width:100%;min-height:220px;resize:vertical;background:#111b28;color:white;border:1px solid #ffffff18;border-radius:14px;padding:14px;font:inherit;outline:none}.photo{height:230px;border-radius:17px;background:linear-gradient(140deg,#343e4e,#111722 55%,#56606a);display:grid;place-items:center;font-size:48px;margin-bottom:12px;border:1px solid #ffffff12}h3{font-size:18px;line-height:1.3;margin:8px 0 12px}.card p{line-height:1.5}.app:active .icon,.dock button:active{transform:scale(.94)}
@media(max-height:700px){#home{padding-top:18px}.clock{font-size:60px;margin-bottom:32px}.grid{gap:22px 10px}.icon{width:53px;height:53px}}
</style></head><body><div id="phone"><div class="status"><span>9:41</span><span class="status-right"><svg viewBox="0 0 18 14" aria-hidden="true"><path d="M1.5 4.5a11 11 0 0 1 15 0M4.5 7.5a6.5 6.5 0 0 1 9 0M7.5 10.5a2.2 2.2 0 0 1 3 0"/></svg><svg viewBox="0 0 22 14" aria-hidden="true"><path d="M1 3h17v9H1zM20 6v3"/><path d="M3.5 5.5h11v4h-11z" fill="currentColor" stroke="none"/></svg></span></div>
<main id="home"><div class="date">ПОНЕДЕЛЬНИК, 23 НОЯБРЯ</div><div class="clock">21:41</div><div class="grid">
<button class="app" onclick="openApp('Messages')"><span class="icon messages"><svg viewBox="0 0 24 24"><path d="M4 5.5h16v11H9l-5 3z"/><path d="M8 10h8M8 13.5h5"/></svg></span>Сообщения</button><button class="app" onclick="openApp('Photos')"><span class="icon photos"><svg viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="16" rx="3"/><circle cx="9" cy="9" r="1.5"/><path d="m4.5 17 5-5 3.5 3 2.5-2 4 4"/></svg></span>Фото</button><button class="app" onclick="openApp('Phone')"><span class="icon phoneapp"><svg viewBox="0 0 24 24"><path d="M7 3.5 4.5 5c-.8.5-.9 1.5-.6 2.4 2.1 5.7 6.5 10.1 12.2 12.2.9.3 1.9.2 2.4-.6l1.5-2.5-4.3-3-2 2a15 15 0 0 1-5.8-5.8l2-2z"/></svg></span>Телефон</button><button class="app" onclick="openApp('Browser')"><span class="icon browser"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="m15.5 8.5-2.2 5-4.8 2 2-4.8z"/></svg></span>Браузер</button><button class="app" onclick="openApp('Notes')"><span class="icon notes"><svg viewBox="0 0 24 24"><path d="M6 4.5h12v15H6zM9 9h6M9 12.5h6M9 16h4"/></svg></span>Заметки</button><button class="app" onclick="openApp('Settings')"><span class="icon settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="m19 13.5 1.2 1-.9 1.6-1.5-.4-1.2 1.2.4 1.5-1.6.9-1-1.2h-1.7l-1 1.2-1.6-.9.4-1.5-1.2-1.2-1.5.4-.9-1.6 1.2-1v-1.7l-1.2-1 .9-1.6 1.5.4 1.2-1.2-.4-1.5 1.6-.9 1 1.2h1.7l1-1.2 1.6.9-.4 1.5 1.2 1.2 1.5-.4.9 1.6-1.2 1z"/></svg></span>Настройки</button></div></main>
<div class="dock"><button aria-label="Телефон" onclick="openApp('Phone')"><svg viewBox="0 0 24 24"><path d="M7 3.5 4.5 5c-.8.5-.9 1.5-.6 2.4 2.1 5.7 6.5 10.1 12.2 12.2.9.3 1.9.2 2.4-.6l1.5-2.5-4.3-3-2 2a15 15 0 0 1-5.8-5.8l2-2z"/></svg></button><button aria-label="Сообщения" onclick="openApp('Messages')"><svg viewBox="0 0 24 24"><path d="M4 5.5h16v11H9l-5 3z"/></svg></button><button aria-label="Браузер" onclick="openApp('Browser')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="m15.5 8.5-2.2 5-4.8 2 2-4.8z"/></svg></button><button aria-label="Фото" onclick="openApp('Photos')"><svg viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="16" rx="3"/><circle cx="9" cy="9" r="1.5"/><path d="m4.5 17 5-5 3.5 3 2.5-2 4 4"/></svg></button></div>
<section id="appview"><header class="top"><button class="back" onclick="goHome()">‹ Назад</button><div class="apptitle" id="apptitle"></div></header><div class="content" id="content"></div></section></div>
<script>
const $=id=>document.getElementById(id),SAVE_KEY='lastseen_save';let state={};try{state=JSON.parse(localStorage.getItem(SAVE_KEY)||'{}')}catch(e){}state.flags=state.flags||{};state.notes=state.notes||'';state.chats=state.chats||{};
for(const k of ['unknown','mark','alina'])if(state.flags[k]&&!state.chats[k])state.chats[k]={choice:state.flags[k+'_reply']||'Сообщение отправлено в предыдущей версии.',responses:['Переписка восстановлена из сохранения предыдущей версии.'],replyTime:'21:42'};
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(state))}catch(e){alert('Не удалось сохранить прогресс.')}}
function goHome(){$('appview').style.display='none';$('home').style.display='block';document.querySelector('.dock').style.display='flex'}
function openApp(n){$('home').style.display='none';document.querySelector('.dock').style.display='none';$('appview').style.display='flex';$('apptitle').textContent=({Messages:'Сообщения',Photos:'Фото',Phone:'Телефон',Browser:'Браузер',Notes:'Заметки',Settings:'Настройки'})[n]||n;render(n)}
function render(n){let c=$('content');if(n==='Messages')c.innerHTML=messages();if(n==='Photos')c.innerHTML=photos();if(n==='Phone')c.innerHTML=phone();if(n==='Browser')c.innerHTML=browser();if(n==='Notes'){c.innerHTML='<div class="section-label">ЛИЧНАЯ ЗАМЕТКА · АВТОСОХРАНЕНИЕ</div><textarea id="note" placeholder="Запишите всё важное..."></textarea>';$('note').value=state.notes;$('note').addEventListener('input',e=>{state.notes=e.target.value;save()})}if(n==='Settings')c.innerHTML='<div class="card"><b>LAST SEEN · ПРОТОТИП 0.8</b><p class="muted">Локальное сохранение включено</p><p>Отправлено сообщений: '+Object.keys(state.chats).length+'</p><p>Сохранено улик: '+[state.flags.photo,state.flags.call,state.flags.news].filter(Boolean).length+'</p></div><button class="choice" onclick="if(confirm(\'Сбросить весь прогресс?\')){localStorage.removeItem(SAVE_KEY);location.reload()}">Сбросить игру</button>'}
const people={
UNKNOWN:{key:'unknown',initial:'?',time:'21:41',opening:['Ты дома?','Нам нужно поговорить. Это касается той ночи.'],options:['Кто это?','Что произошло той ночью?','Не пиши мне.'],responses:{'Кто это?':['Неважно, кто я. Важно, что ты был там.','Я не собираюсь ничего объяснять по телефону.'],'Что произошло той ночью?':['Ты правда ничего не помнишь?','13 ноября. Парковка торгового центра. Вспомни.'],'Не пиши мне.':['Тогда не открывай сообщения с этого номера.']}},
Mark:{key:'mark',initial:'M',time:'20:58',opening:['Брат, ты где пропал?','У тебя всё нормально? Ты вчера вообще ничего не помнишь?'],options:['Что было вчера?','Да, всё нормально.'],responses:{'Что было вчера?':['Мы пересеклись поздно вечером. Ты был какой-то потерянный.','Лучше поговорим лично, ладно?'],'Да, всё нормально.':['Окей. Просто проверь телефон. Ты вчера его где-то оставил?']}},
Alina:{key:'alina',initial:'A',time:'19:12',opening:['Ты обещал мне перезвонить. Я волнуюсь.'],options:['Прости. У меня странный вечер.','Ты знаешь, что было 13 ноября?'],responses:{'Прости. У меня странный вечер.':['Я заметила. Ты весь день отвечаешь как будто не сам.','Если захочешь поговорить — я на связи.'],'Ты знаешь, что было 13 ноября?':['Почему ты спрашиваешь именно про эту дату?','Ты тогда мне так и не перезвонил.']}}
};
for(const p of Object.values(people)){const s=state.chats[p.key];if(s){const r=p.responses[s.choice];const oldReply=!Array.isArray(s.responses)||!s.responses.length||s.responses.some(x=>/восстановлена|предыдущей версии|переписка сохранена/i.test(String(x)));if(r&&oldReply){s.responses=r.slice();s.replyTime=p.key==='unknown'?'21:42':p.key==='mark'?'21:00':'21:14';}if(!Array.isArray(s.responses))s.responses=[];}}
function responseFor(p,s){const saved=Array.isArray(s&&s.responses)?s.responses:[];if(saved.length&&!saved.some(x=>/восстановлена|предыдущей версии|переписка сохранена/i.test(String(x))))return saved;return (p.responses[s&&s.choice]||['Сообщение прочитано.']).slice()}
try{localStorage.setItem(SAVE_KEY,JSON.stringify(state))}catch(e){}
function esc(v){return String(v).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function lastMessage(p,s){if(!s)return p.opening[p.opening.length-1];const arr=responseFor(p,s);return arr.length?arr[arr.length-1]:s.choice}
function messages(){return '<div class="section-label">ВХОДЯЩИЕ · '+Object.keys(people).length+'</div>'+Object.entries(people).map(([n,p])=>{let s=state.chats[p.key],preview=lastMessage(p,s);return '<div class="card row" onclick="thread(\''+n+'\')"><div class="avatar">'+p.initial+'</div><div style="min-width:0;flex:1"><div class="chat-name">'+(n==='UNKNOWN'?'Неизвестный номер':n==='Mark'?'Марк':'Алина')+'</div><div class="chat-preview">'+esc(preview)+'</div></div><span class="chat-meta">'+(s?s.replyTime:p.time)+'</span></div>'}).join('')}
function thread(n){let p=people[n],s=state.chats[p.key],h='<div class="timestamp">Сегодня · '+p.time+'</div>'+p.opening.map(t=>'<div class="bubble">'+esc(t)+'</div>').join('');if(s){const replies=responseFor(p,s);h+='<div class="timestamp">Ваш ответ</div><div class="bubble mine">'+esc(s.choice)+'</div><div class="timestamp">Ответ · '+(s.replyTime||'21:42')+'</div>'+replies.map(t=>'<div class="bubble">'+esc(t)+'</div>').join('')+'<div class="notice">История переписки сохранена.</div>'}else h+='<div class="timestamp">Выберите ответ</div>'+p.options.map((t,i)=>'<button class="choice" data-choice="'+i+'">'+esc(t)+'</button>').join('');const box=$('content');box.innerHTML=h;if(!s)box.querySelectorAll('[data-choice]').forEach(btn=>btn.addEventListener('click',()=>sendReply(p.key,p.options[Number(btn.dataset.choice)])))}
function sendReply(k,t){if(state.chats[k])return;let p=Object.values(people).find(x=>x.key===k);state.chats[k]={choice:t,responses:(p.responses[t]||['Сообщение прочитано.']).slice(),replyTime:k==='unknown'?'21:42':k==='mark'?'21:00':'21:14'};state.flags[k]=true;state.flags[k+'_reply']=t;save();thread(Object.keys(people).find(n=>people[n].key===k))}
function photos(){return '<div class="section-label">НЕДАВНО · 13 НОЯБРЯ</div><div class="photo">🌃</div><div class="card"><b>IMG_1148.jpg</b><p class="muted">13 ноября · 23:16</p><p>Ночной снимок возле торгового центра. На заднем плане — вход со стороны парковки.</p><button class="choice" onclick="state.flags.photo=true;save();this.textContent=\'Сохранено в заметках улик\'">Сохранить как улику</button></div>'}
function phone(){return '<div class="section-label">НЕДАВНИЕ ВЫЗОВЫ</div><div class="card">↗ Mark <span class="muted"> · сегодня, 20:54 · исходящий</span></div><div class="card">↙ Неизвестный номер <span class="muted"> · вчера, 00:17 · пропущен</span></div><div class="card">↗ Alina <span class="muted"> · вчера, 22:08 · исходящий</span></div><button class="choice" onclick="state.flags.call=true;save();this.textContent=\'Номер отмечен\'">Отметить неизвестный номер</button>'}
function browser(){return '<div class="card"><div class="section-label">ЛОКАЛЬНЫЕ НОВОСТИ · 14 НОЯБРЯ</div><h3>Полиция просит откликнуться очевидцев происшествия у торгового центра</h3><p>Вечером 13 ноября рядом с парковкой торгового центра произошёл инцидент. Полиция проверяет записи камер и просит свидетелей связаться с отделом.</p><p class="muted">Опубликовано 09:12</p><button class="choice" onclick="state.flags.news=true;save();this.textContent=\'Статья сохранена\'">Сохранить статью</button></div>'}
</script></body></html>
