<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b11"><title>LAST SEEN</title>
<style>
:root{color-scheme:dark;--bg:#080b11;--panel:#121a26;--line:#263346;--muted:#8996a9;--blue:#3987f6}
*{box-sizing:border-box}body{margin:0;background:#05070b;color:#f4f6fa;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;justify-content:center;min-height:100dvh}
button{font:inherit;cursor:pointer}#phone{width:min(100%,430px);height:100dvh;min-height:600px;background:radial-gradient(ellipse at 50% 0%,#1c2a3d 0,#0d1420 43%,#080b11 82%);position:relative;overflow:hidden}
.status{height:42px;padding:12px 24px 0;display:flex;justify-content:space-between;font-size:12px;font-weight:700;letter-spacing:.2px}
#home{padding:30px 22px 110px;height:calc(100% - 42px);overflow:auto}.date{color:#aab6c7;font-size:13px;letter-spacing:.3px;margin:8px 0 4px}.clock{font-size:64px;font-weight:220;letter-spacing:-3px;margin-bottom:42px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:29px 12px}.app{border:0;background:none;color:#e9edf4;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:11px;padding:0}
.icon{width:59px;height:59px;border-radius:18px;display:grid;place-items:center;font-size:25px;background:linear-gradient(145deg,#35465d,#151e2b);box-shadow:0 9px 22px #0008,inset 0 1px #ffffff28;border:1px solid #ffffff19}.messages{background:linear-gradient(145deg,#55e58c,#16854b)}.photos{background:linear-gradient(145deg,#f8d46a,#d96c58)}.phoneapp{background:linear-gradient(145deg,#55d88b,#188b62)}.browser{background:linear-gradient(145deg,#64b5ff,#3156b9)}.notes{background:linear-gradient(145deg,#ffe58c,#d9a92e);color:#3b3217}.settings{background:linear-gradient(145deg,#aab5c6,#566174)}
.dock{position:absolute;bottom:13px;left:18px;right:18px;height:78px;border-radius:26px;background:#ffffff17;border:1px solid #ffffff16;backdrop-filter:blur(24px);display:flex;justify-content:space-evenly;align-items:center}.dock button{border:0;background:none;font-size:25px;color:white}
#appview{position:absolute;inset:42px 0 0;background:linear-gradient(180deg,#0c121c,#090d14);display:none;flex-direction:column}
.top{height:62px;flex:none;display:flex;align-items:center;padding:0 18px;border-bottom:1px solid #ffffff10;background:#0c121ceF;backdrop-filter:blur(18px);gap:12px}
.back{border:0;background:none;color:#77adff;font-size:15px;padding:9px 0}.apptitle{font-weight:700;font-size:16px;flex:1;text-align:center;margin-right:42px;letter-spacing:.2px}
.content{padding:18px 16px 28px;overflow:auto;flex:1}.card{background:linear-gradient(145deg,#172231,#111925);border:1px solid #ffffff10;border-radius:18px;padding:15px;margin-bottom:11px;box-shadow:0 8px 22px #0002}
.muted{color:var(--muted);font-size:12px}.row{display:flex;align-items:center;gap:12px}.avatar{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#354a66,#1b293b);font-weight:700;border:1px solid #ffffff20}
.choice{width:100%;text-align:left;padding:15px 16px;border-radius:14px;background:linear-gradient(145deg,#1b2a3e,#141e2c);color:#eaf1ff;border:1px solid #ffffff16;margin:7px 0;font-size:14px;line-height:1.35;transition:transform .15s,border-color .15s}.choice:active{transform:scale(.985);border-color:#5597ef}
.bubble{max-width:88%;padding:12px 15px;border-radius:18px;margin:9px 0;background:#202a38;line-height:1.45;white-space:pre-wrap;border:1px solid #ffffff08}.mine{margin-left:auto;background:linear-gradient(145deg,#2878d7,#1759a9);border-color:#ffffff12}
.timestamp{text-align:center;color:#748298;font-size:10px;letter-spacing:.5px;text-transform:uppercase;margin:17px 0}.notice{color:#93a4ba;font-size:11px;margin:14px 3px}
textarea{width:100%;min-height:220px;resize:vertical;background:#111a26;color:white;border:1px solid #ffffff18;border-radius:14px;padding:14px;font:inherit}
.photo{height:230px;border-radius:16px;background:linear-gradient(140deg,#343e4e,#111722 55%,#56606a);display:grid;place-items:center;font-size:48px;margin-bottom:12px}.tag{font-size:10px;color:#a9caff;background:#193253;border:1px solid #38547b;padding:5px 8px;border-radius:20px;white-space:nowrap}
.section-label{font-size:10px;color:#71829a;letter-spacing:1.4px;margin:2px 3px 13px}.chat-preview{font-size:12px;color:#9ba9bc;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-name{font-size:14px;font-weight:650}.card.row{padding:13px 14px;cursor:pointer}.card.row:active{transform:scale(.99)}
</style></head><body><div id="phone"><div class="status"><span>9:41</span><span>●●● ▰</span></div>
<main id="home"><div class="date">ПОНЕДЕЛЬНИК, 23 НОЯБРЯ</div><div class="clock">21:41</div><div class="grid">
<button class="app" onclick="openApp('Messages')"><span class="icon messages">●</span>Messages</button><button class="app" onclick="openApp('Photos')"><span class="icon photos">🌄</span>Photos</button><button class="app" onclick="openApp('Phone')"><span class="icon phoneapp">☎</span>Phone</button><button class="app" onclick="openApp('Browser')"><span class="icon browser">◉</span>Browser</button><button class="app" onclick="openApp('Notes')"><span class="icon notes">▤</span>Notes</button><button class="app" onclick="openApp('Settings')"><span class="icon settings">⚙</span>Settings</button></div></main>
<div class="dock"><button onclick="openApp('Phone')">☎</button><button onclick="openApp('Messages')">●</button><button onclick="openApp('Browser')">◉</button><button onclick="openApp('Photos')">🌄</button></div>
<section id="appview"><header class="top"><button class="back" onclick="goHome()">‹ Назад</button><div class="apptitle" id="apptitle"></div></header><div class="content" id="content"></div></section></div>
<script>
const $=id=>document.getElementById(id),SAVE_KEY='lastseen_save';let state={};try{state=JSON.parse(localStorage.getItem(SAVE_KEY)||'{}')}catch(e){}state.flags=state.flags||{};state.notes=state.notes||'';state.chats=state.chats||{};
for(const k of ['unknown','mark','alina'])if(state.flags[k]&&!state.chats[k])state.chats[k]={choice:state.flags[k+'_reply']||'Сообщение отправлено в предыдущей версии.',responses:['Переписка восстановлена из сохранения предыдущей версии.'],replyTime:'21:42'};
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(state))}catch(e){alert('Не удалось сохранить прогресс.')}}
function goHome(){$('appview').style.display='none';$('home').style.display='block';document.querySelector('.dock').style.display='flex'}
function openApp(n){$('home').style.display='none';document.querySelector('.dock').style.display='none';$('appview').style.display='flex';$('apptitle').textContent=n;render(n)}
function render(n){let c=$('content');if(n==='Messages')c.innerHTML=messages();if(n==='Photos')c.innerHTML=photos();if(n==='Phone')c.innerHTML=phone();if(n==='Browser')c.innerHTML=browser();if(n==='Notes'){c.innerHTML='<div class="section-label">ЛИЧНАЯ ЗАМЕТКА · АВТОСОХРАНЕНИЕ</div><textarea id="note" placeholder="Запишите всё важное..."></textarea>';$('note').value=state.notes;$('note').addEventListener('input',e=>{state.notes=e.target.value;save()})}if(n==='Settings')c.innerHTML='<div class="card"><b>LAST SEEN · PROTOTYPE 0.7</b><p class="muted">Локальное сохранение включено</p><p>Отправлено сообщений: '+Object.keys(state.chats).length+'</p><p>Сохранено улик: '+[state.flags.photo,state.flags.call,state.flags.news].filter(Boolean).length+'</p></div><button class="choice" onclick="if(confirm(\'Сбросить весь прогресс?\')){localStorage.removeItem(SAVE_KEY);location.reload()}">Сбросить игру</button>'}
const people={
UNKNOWN:{key:'unknown',initial:'?',time:'21:41',opening:['Ты дома?','Нам нужно поговорить. Это касается той ночи.'],options:['Кто это?','Что произошло той ночью?','Не пиши мне.'],responses:{'Кто это?':['Неважно, кто я. Важно, что ты был там.','Я не собираюсь ничего объяснять по телефону.'],'Что произошло той ночью?':['Ты правда ничего не помнишь?','13 ноября. Парковка торгового центра. Вспомни.'],'Не пиши мне.':['Тогда не открывай сообщения с этого номера.']}},
Mark:{key:'mark',initial:'M',time:'20:58',opening:['Брат, ты где пропал?','У тебя всё нормально? Ты вчера вообще ничего не помнишь?'],options:['Что было вчера?','Да, всё нормально.'],responses:{'Что было вчера?':['Мы пересеклись поздно вечером. Ты был какой-то потерянный.','Лучше поговорим лично, ладно?'],'Да, всё нормально.':['Окей. Просто проверь телефон. Ты вчера его где-то оставил?']}},
Alina:{key:'alina',initial:'A',time:'19:12',opening:['Ты обещал мне перезвонить. Я волнуюсь.'],options:['Прости. У меня странный вечер.','Ты знаешь, что было 13 ноября?'],responses:{'Прости. У меня странный вечер.':['Я заметила. Ты весь день отвечаешь как будто не сам.','Если захочешь поговорить — я на связи.'],'Ты знаешь, что было 13 ноября?':['Почему ты спрашиваешь именно про эту дату?','Ты тогда мне так и не перезвонил.']}}
};
for(const p of Object.values(people)){const s=state.chats[p.key];if(s){const r=p.responses[s.choice];if(r&&(!s.responses||!s.responses.length||s.responses[0].includes('восстановлена')||s.responses[0].includes('предыдущей версии'))){s.responses=r;s.replyTime=p.key==='unknown'?'21:42':p.key==='mark'?'21:00':'21:14';}}}
function esc(v){return String(v).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function lastMessage(p,s){if(!s)return p.opening[p.opening.length-1];const arr=Array.isArray(s.responses)?s.responses:[];return arr.length?arr[arr.length-1]:s.choice}
function messages(){return '<div class="section-label">СООБЩЕНИЯ · '+Object.keys(people).length+'</div>'+Object.entries(people).map(([n,p])=>{let s=state.chats[p.key],preview=lastMessage(p,s);return '<div class="card row" onclick="thread(\''+n+'\')"><div class="avatar">'+p.initial+'</div><div style="min-width:0;flex:1"><div class="chat-name">'+n+'</div><div class="chat-preview">'+esc(preview)+'</div></div>'+(s?'<span class="tag">доставлено</span>':'')+'</div>'}).join('')}
function thread(n){let p=people[n],s=state.chats[p.key],h='<div class="timestamp">Сегодня · '+p.time+'</div>'+p.opening.map(t=>'<div class="bubble">'+esc(t)+'</div>').join('');if(s){h+='<div class="timestamp">Ваш ответ</div><div class="bubble mine">'+esc(s.choice)+'</div><div class="timestamp">Ответ · '+s.replyTime+'</div>'+s.responses.map(t=>'<div class="bubble">'+esc(t)+'</div>').join('')+'<div class="notice">Выбор сохранён.</div>'}else h+='<div class="timestamp">Выберите ответ</div>'+p.options.map(t=>'<button class="choice" onclick="sendReply(\''+p.key+'\',\''+t.replace(/'/g,"\\\\\'")+'\')">'+esc(t)+'</button>').join('');$('content').innerHTML=h}
function sendReply(k,t){if(state.chats[k])return;let p=Object.values(people).find(x=>x.key===k);state.chats[k]={choice:t,responses:p.responses[t]||['Сообщение прочитано.'],replyTime:k==='unknown'?'21:42':k==='mark'?'21:00':'21:14'};state.flags[k]=true;state.flags[k+'_reply']=t;save();thread(Object.keys(people).find(n=>people[n].key===k))}
function photos(){return '<div class="section-label">НЕДАВНО · 13 НОЯБРЯ</div><div class="photo">🌃</div><div class="card"><b>IMG_1148.jpg</b><p class="muted">13 ноября · 23:16</p><p>Ночной снимок возле торгового центра. На заднем плане — вход со стороны парковки.</p><button class="choice" onclick="state.flags.photo=true;save();this.textContent=\'Сохранено в заметках улик\'">Сохранить как улику</button></div>'}
function phone(){return '<div class="section-label">НЕДАВНИЕ ВЫЗОВЫ</div><div class="card">↗ Mark <span class="muted"> · сегодня, 20:54 · исходящий</span></div><div class="card">↙ Неизвестный номер <span class="muted"> · вчера, 00:17 · пропущен</span></div><div class="card">↗ Alina <span class="muted"> · вчера, 22:08 · исходящий</span></div><button class="choice" onclick="state.flags.call=true;save();this.textContent=\'Номер отмечен\'">Отметить неизвестный номер</button>'}
function browser(){return '<div class="card"><div class="section-label">ЛОКАЛЬНЫЕ НОВОСТИ · 14 НОЯБРЯ</div><h3>Полиция просит откликнуться очевидцев происшествия у торгового центра</h3><p>Вечером 13 ноября рядом с парковкой торгового центра произошёл инцидент. Полиция проверяет записи камер и просит свидетелей связаться с отделом.</p><p class="muted">Опубликовано 09:12</p><button class="choice" onclick="state.flags.news=true;save();this.textContent=\'Статья сохранена\'">Сохранить статью</button></div>'}
</script></body></html>
