<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090c12"><title>LAST SEEN</title>
<style>
:root{color-scheme:dark;--panel:#171e29;--line:#2b3544;--muted:#929cac}*{box-sizing:border-box}body{margin:0;background:#05070b;color:#f3f5f8;font:15px -apple-system,BlinkMacSystemFont,sans-serif;display:flex;justify-content:center;min-height:100dvh}button{font:inherit;cursor:pointer}#phone{width:min(100%,430px);height:100dvh;min-height:600px;background:radial-gradient(ellipse at 50% 14%,#202c3d,#101722 43%,#090c12 82%);position:relative;overflow:hidden}.status{height:34px;padding:9px 22px 0;display:flex;justify-content:space-between;font-size:12px;font-weight:650}#home{padding:22px 22px 100px;height:calc(100% - 34px);overflow:auto}.date{color:#c2cad6;font-size:14px;margin:8px 0 5px}.clock{font-size:54px;font-weight:250;letter-spacing:-2px;margin-bottom:35px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:25px 12px}.app{border:0;background:none;color:white;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11px;padding:0}.icon{width:57px;height:57px;border-radius:16px;display:grid;place-items:center;font-size:27px;background:linear-gradient(145deg,#333e50,#171d28);box-shadow:0 7px 18px #0007;border:1px solid #ffffff18}.messages{background:linear-gradient(145deg,#43d878,#168b4d)}.photos{background:linear-gradient(145deg,#f8d46a,#e16c55)}.phoneapp{background:linear-gradient(145deg,#55d88b,#188b62)}.browser{background:linear-gradient(145deg,#5ba9ff,#3156b9)}.notes{background:linear-gradient(145deg,#ffe58c,#d9a92e);color:#3b3217}.settings{background:linear-gradient(145deg,#aab5c6,#566174)}.dock{position:absolute;bottom:12px;left:18px;right:18px;height:76px;border-radius:24px;background:#ffffff19;backdrop-filter:blur(20px);display:flex;justify-content:space-evenly;align-items:center}.dock button{border:0;background:none;font-size:26px}#appview{position:absolute;inset:34px 0 0;background:#0c1018;display:none;flex-direction:column}.top{height:58px;flex:none;display:flex;align-items:center;padding:0 17px;border-bottom:1px solid var(--line);gap:12px}.back{border:0;background:none;color:#78aaff;font-size:16px;padding:8px 0}.apptitle{font-weight:700;font-size:17px;flex:1;text-align:center;margin-right:42px}.content{padding:16px;overflow:auto;flex:1;padding-bottom:22px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:11px}.muted{color:var(--muted);font-size:12px}.row{display:flex;align-items:center;gap:11px}.avatar{width:42px;height:42px;flex:none;border-radius:50%;display:grid;place-items:center;background:#26374d;font-weight:700}.choice{width:100%;text-align:left;padding:14px;border-radius:12px;background:#192333;color:#eaf1ff;border:1px solid #34445c;margin:6px 0;font-size:14px}.bubble{max-width:86%;padding:11px 13px;border-radius:16px;margin:9px 0;background:#252c38;line-height:1.4;white-space:pre-wrap}.mine{margin-left:auto;background:#1768c5}.timestamp{text-align:center;color:#788395;font-size:11px;margin:14px 0}.notice{color:#f3c978;font-size:12px;margin:12px 0}textarea{width:100%;min-height:220px;resize:vertical;background:#171e29;color:white;border:1px solid #364151;border-radius:10px;padding:12px;font:inherit}.photo{height:230px;border-radius:12px;background:linear-gradient(140deg,#343e4e,#111722 55%,#56606a);display:grid;place-items:center;font-size:48px;margin-bottom:12px}.tag{font-size:10px;color:#9bbcff;border:1px solid #38547b;padding:3px 7px;border-radius:20px}
</style></head><body><div id="phone"><div class="status"><span>9:41</span><span>●●● ▰</span></div><main id="home"><div class="date">Понедельник, 23 ноября</div><div class="clock">21:41</div><div class="grid">
<button class="app" onclick="openApp('Messages')"><span class="icon messages">●</span>Messages</button><button class="app" onclick="openApp('Photos')"><span class="icon photos">🌄</span>Photos</button><button class="app" onclick="openApp('Phone')"><span class="icon phoneapp">☎</span>Phone</button><button class="app" onclick="openApp('Browser')"><span class="icon browser">◉</span>Browser</button><button class="app" onclick="openApp('Notes')"><span class="icon notes">▤</span>Notes</button><button class="app" onclick="openApp('Settings')"><span class="icon settings">⚙</span>Settings</button></div></main><div class="dock"><button onclick="openApp('Phone')">☎</button><button onclick="openApp('Messages')">●</button><button onclick="openApp('Browser')">◉</button><button onclick="openApp('Photos')">🌄</button></div><section id="appview"><header class="top"><button class="back" onclick="goHome()">‹ Назад</button><div class="apptitle" id="apptitle"></div></header><div class="content" id="content"></div></section></div>
<script>
const $=id=>document.getElementById(id),SAVE_KEY='lastseen_save';let state={};try{state=JSON.parse(localStorage.getItem(SAVE_KEY)||'{}')}catch(e){}state.flags=state.flags||{};state.notes=state.notes||'';state.chats=state.chats||{};
for(const k of ['unknown','mark','alina'])if(state.flags[k]&&!state.chats[k])state.chats[k]={choice:state.flags[k+'_reply']||'Сообщение отправлено в предыдущей версии.',responses:['Переписка восстановлена из сохранения предыдущей версии.'],replyTime:'21:42'};
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(state))}catch(e){alert('Не удалось сохранить прогресс.')}}
function goHome(){$('appview').style.display='none';$('home').style.display='block';document.querySelector('.dock').style.display='flex'}
function openApp(n){$('home').style.display='none';document.querySelector('.dock').style.display='none';$('appview').style.display='flex';$('apptitle').textContent=n;render(n)}
function render(n){let c=$('content');if(n==='Messages')c.innerHTML=messages();if(n==='Photos')c.innerHTML=photos();if(n==='Phone')c.innerHTML=phone();if(n==='Browser')c.innerHTML=browser();if(n==='Notes'){c.innerHTML='<div class="muted">ЛИЧНАЯ ЗАМЕТКА · АВТОСОХРАНЕНИЕ</div><textarea id="note" placeholder="Запишите всё важное..."></textarea>';$('note').value=state.notes;$('note').addEventListener('input',e=>{state.notes=e.target.value;save()})}if(n==='Settings')c.innerHTML='<div class="card"><b>LAST SEEN · PROTOTYPE 0.6</b><p class="muted">Локальное сохранение включено</p><p>Отправлено сообщений: '+Object.keys(state.chats).length+'</p><p>Сохранено улик: '+[state.flags.photo,state.flags.call,state.flags.news].filter(Boolean).length+'</p></div><button class="choice" onclick="if(confirm(\'Сбросить весь прогресс?\')){localStorage.removeItem(SAVE_KEY);location.reload()}">Сбросить игру</button>'}
const people={
UNKNOWN:{key:'unknown',initial:'?',time:'21:41',opening:['Ты дома?','Нам нужно поговорить. Это касается той ночи.'],options:['Кто это?','Что произошло той ночью?','Не пиши мне.'],responses:{'Кто это?':['Неважно, кто я. Важно, что ты был там.','Я не собираюсь ничего объяснять по телефону.'],'Что произошло той ночью?':['Ты правда ничего не помнишь?','13 ноября. Парковка торгового центра. Вспомни.'],'Не пиши мне.':['Тогда не открывай сообщения с этого номера.']}},
Mark:{key:'mark',initial:'M',time:'20:58',opening:['Брат, ты где пропал?','У тебя всё нормально? Ты вчера вообще ничего не помнишь?'],options:['Что было вчера?','Да, всё нормально.'],responses:{'Что было вчера?':['Мы пересеклись поздно вечером. Ты был какой-то потерянный.','Лучше поговорим лично, ладно?'],'Да, всё нормально.':['Окей. Просто проверь телефон. Ты вчера его где-то оставил?']}},
Alina:{key:'alina',initial:'A',time:'19:12',opening:['Ты обещал мне перезвонить. Я волнуюсь.'],options:['Прости. У меня странный вечер.','Ты знаешь, что было 13 ноября?'],responses:{'Прости. У меня странный вечер.':['Я заметила. Ты весь день отвечаешь как будто не сам.','Если захочешь поговорить — я на связи.'],'Ты знаешь, что было 13 ноября?':['Почему ты спрашиваешь именно про эту дату?','Ты тогда мне так и не перезвонил.']}}
};

// Restore real replies for migrated conversations
for (const p of Object.values(people)) {
  const s = state.chats[p.key];
  if (!s) continue;

  const reply = p.responses[s.choice];
  if (reply && (
    !s.responses ||
    !s.responses.length ||
    s.responses[0].includes('восстановлена') ||
    s.responses[0].includes('предыдущей версии')
  )) {
    s.responses = reply;
    s.replyTime = p.key === 'unknown' ? '21:42'
      : p.key === 'mark' ? '21:00' : '21:14';
  }
}

  function esc(v){return String(v).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function messages(){return '<div class="muted">СООБЩЕНИЯ</div>'+Object.entries(people).map(([n,p])=>{let s=state.chats[p.key],preview=s?s.choice:p.opening[p.opening.length-1];return '<div class="card row" onclick="thread(\''+n+'\')"><div class="avatar">'+p.initial+'</div><div style="min-width:0;flex:1"><b>'+n+'</b><div class="muted">'+esc(preview)+'</div></div>'+(s?'<span class="tag">отправлено</span>':'')+'</div>'}).join('')}
function thread(n){let p=people[n],s=state.chats[p.key],h='<div class="timestamp">Сегодня · '+p.time+'</div>'+p.opening.map(t=>'<div class="bubble">'+esc(t)+'</div>').join('');if(s){h+='<div class="timestamp">Ваш ответ</div><div class="bubble mine">'+esc(s.choice)+'</div><div class="timestamp">Ответ · '+s.replyTime+'</div>'+s.responses.map(t=>'<div class="bubble">'+esc(t)+'</div>').join('')+'<div class="notice">Ответ отправлен. Выбор зафиксирован и больше не изменится.</div>'}else h+='<div class="timestamp">Выберите ответ</div>'+p.options.map(t=>'<button class="choice" onclick="sendReply(\''+p.key+'\',\''+t.replace(/'/g,"\\\'")+'\')">'+esc(t)+'</button>').join('');$('content').innerHTML=h}
function sendReply(k,t){if(state.chats[k])return;let p=Object.values(people).find(x=>x.key===k);state.chats[k]={choice:t,responses:p.responses[t]||['Сообщение прочитано.'],replyTime:k==='unknown'?'21:42':k==='mark'?'21:00':'21:14'};state.flags[k]=true;state.flags[k+'_reply']=t;save();thread(Object.keys(people).find(n=>people[n].key===k))}
function photos(){return '<div class="muted">НЕДАВНО · 13 НОЯБРЯ</div><div class="photo">🌃</div><div class="card"><b>IMG_1148.jpg</b><p class="muted">13 ноября · 23:16</p><p>Ночной снимок возле торгового центра. На заднем плане — вход со стороны парковки.</p><button class="choice" onclick="state.flags.photo=true;save();this.textContent=\'Сохранено в заметках улик\'">Сохранить как улику</button></div>'}
function phone(){return '<div class="muted">НЕДАВНИЕ ВЫЗОВЫ</div><div class="card">↗ Mark <span class="muted"> · сегодня, 20:54 · исходящий</span></div><div class="card">↙ Неизвестный номер <span class="muted"> · вчера, 00:17 · пропущен</span></div><div class="card">↗ Alina <span class="muted"> · вчера, 22:08 · исходящий</span></div><button class="choice" onclick="state.flags.call=true;save();this.textContent=\'Номер отмечен\'">Отметить неизвестный номер</button>'}
function browser(){return '<div class="card"><div class="muted">ЛОКАЛЬНЫЕ НОВОСТИ · 14 НОЯБРЯ</div><h3>Полиция просит откликнуться очевидцев происшествия у торгового центра</h3><p>Вечером 13 ноября рядом с парковкой торгового центра произошёл инцидент. Полиция проверяет записи камер и просит свидетелей связаться с отделом.</p><p class="muted">Опубликовано 09:12</p><button class="choice" onclick="state.flags.news=true;save();this.textContent=\'Статья сохранена\'">Сохранить статью</button></div>'}
</script></body></html>
